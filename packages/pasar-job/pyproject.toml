[project]
name = "pasar-job"
version = "0.1.0"
description = "Job-side helpers for the pasar GPU scheduler: checkpoint/resume events and a preemption hook"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pasar_job"]
