[project]
name = "pasar"
version = "0.1.0"
description = "A friendly single-machine GPU job scheduler with bids, preemption, and a web UI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "nvidia-ml-py>=12.535",
    "pydantic>=2",
]

[project.optional-dependencies]
modal = ["modal>=1.5"]

[project.scripts]
pasar = "pasar.cli:main"
pasard = "pasar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pasar"]
artifacts = ["src/pasar/webui/**"]

[tool.uv.workspace]
members = ["packages/pasar-job"]

[tool.uv.sources]
pasar-job = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pasar-job"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/pasar-job/tests"]
pythonpath = ["."]
markers = [
    "systemd: needs a systemd user session",
    "gpu: needs an NVIDIA GPU with PyTorch",
]
addopts = "-m 'not systemd and not gpu'"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated, use anyio.from_thread.BlockingPortal instead\\.:DeprecationWarning",
    # `pasar pull`'s CLI legitimately passes a no-read-timeout for its one request (a
    # multi-GiB download); TestClient still honours it, it just warns that it would rather
    # nobody did this.
    "ignore:You should not use the 'timeout' argument with the TestClient\\.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
